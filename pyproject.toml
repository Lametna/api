[tool.poetry]
name = "lametna-backend"
version = "0.1.0"
description = "Lametna Backend Infrastructure"
authors = ["Lametna Engineering <engineering@lametna.com>"]
readme = "README.md"
packages = [{include = "apps"}, {include = "core"}, {include = "config"}]

[tool.poetry.dependencies]
python = "^3.13"
Django = "^5.0"
djangorestframework = "^3.15.1"
channels = "^4.0.0"
daphne = "^4.0.0"
channels-redis = "^4.2.0"
celery = "^5.3.6"
redis = "^5.0.1"
psycopg = {extras = ["binary", "pool"], version = "^3.1.18"}
django-filter = "^24.2"
drf-spectacular = "^0.27.1"
Pillow = "^10.2.0"
python-dotenv = "^1.0.1"
PyJWT = "^2.8.0"
gunicorn = "^21.2.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.1.1"
pytest-django = "^4.8.0"
pytest-cov = "^4.1.0"
factory-boy = "^3.3.0"
ruff = "^0.3.4"
black = "^24.3.0"
isort = "^5.13.2"
mypy = "^1.9.0"
django-stubs = "^4.2.7"
djangorestframework-stubs = "^3.14.5"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.black]
line-length = 100
target-version = ['py313']

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3

[tool.mypy]
python_version = "3.13"
plugins = ["mypy_django_plugin.main", "rest_framework.ext.mypy.plugin"]
ignore_missing_imports = true
strict = true

[tool.django-stubs]
django_settings_module = "config.settings.dev"
